name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight-and-build:
    name: Lint, Build & Spec Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (for native race preflights)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Oxlint Linter
        run: pnpm lint

      - name: TypeScript Build
        run: pnpm build

      - name: Spec Preflight Gate (False-Positive Verification)
        run: pnpm preflight:specs
